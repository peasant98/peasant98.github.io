name: Replenish Goodbite queue
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions: {}
concurrency:
  group: goodbite-queue
  cancel-in-progress: false
jobs:
  replenish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Replenish saved restaurant pairs
        env:
          MAPS_QUEUE_JOB_TOKEN: ${{ secrets.MAPS_QUEUE_JOB_TOKEN }}
        run: |
          node --input-type=module <<'JS'
          const token = process.env.MAPS_QUEUE_JOB_TOKEN;
          if (!token) throw new Error('The queue job secret is missing.');
          const response = await fetch('https://goodbite-nearby.peasant98.chatgpt.site/api/jobs/maps-queue', {
            method: 'POST', headers: { Authorization: `Bearer ${token}` }, signal: AbortSignal.timeout(240000),
          });
          console.log(JSON.stringify(await response.json()));
          if (!response.ok) process.exitCode = 1;
          JS
