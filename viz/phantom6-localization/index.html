<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Phantom Localization</title>
<style>
  :root { --bg: #f4f5f7; --panel: rgba(255,255,255,.92); --ink: #1d2433; --muted: #5d6677; --line: #d9dde5;
          --found: #e8322f; --scan: #22a447; --accent: #d89a10; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #14171d; --panel: rgba(28,32,40,.92); --ink: #e9ecf2; --muted: #9aa3b4; --line: #333a47; }
  }
  :root[data-theme="dark"] { --bg: #14171d; --panel: rgba(28,32,40,.92); --ink: #e9ecf2; --muted: #9aa3b4; --line: #333a47; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden;
               font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  #stage { position: fixed; inset: 0; }
  #photo { position: absolute; display: none; object-fit: fill; }
  canvas { position: absolute; inset: 0; display: block; touch-action: none; }
  .panel { position: fixed; top: 12px; left: 12px; width: min(320px, calc(100vw - 24px)); background: var(--panel);
           border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; backdrop-filter: blur(8px);
           box-shadow: 0 6px 24px rgba(0,0,0,.12); max-height: calc(100vh - 24px); overflow: auto; }
  h1 { font-size: 15px; margin: 0 0 4px; }
  p { margin: 0 0 8px; color: var(--muted); }
  .key { display: flex; gap: 12px; margin: 6px 0 10px; flex-wrap: wrap; }
  .key span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px;
                      vertical-align: -1px; background: var(--c); }
  .metrics { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; margin: 0 0 10px; padding: 8px 10px;
             border: 1px solid var(--line); border-radius: 8px; }
  .metrics b { font-variant-numeric: tabular-nums; }
  label { display: flex; align-items: center; gap: 8px; padding: 3px 0; cursor: pointer; }
  input[type=range] { width: 100%; }
  .row { margin-top: 8px; }
  button { width: 100%; margin-top: 6px; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line);
           background: var(--ink); color: var(--bg); font: inherit; font-weight: 600; cursor: pointer; }
  button.secondary { background: transparent; color: var(--ink); }
  #status { position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%); background: var(--panel);
            border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; color: var(--muted); }
  .collapse { display: none; }
  @media (max-width: 600px) {
    .panel { top: auto; bottom: 12px; max-height: 46vh; }
    .collapse { display: inline; float: right; background: none; border: 0; color: var(--muted); width: auto; margin: 0; padding: 0; }
    .panel.closed > :not(h1) { display: none; }
  }
</style>
<script type="importmap">
  {"imports": {"three": "./vendor/three/three.module.min.js",
               "three/addons/": "./vendor/three/addons/",
               "@sparkjsdev/spark": "./vendor/spark/spark.module.min.js"}}
</script>
</head>
<body>
<div id="stage"><img id="photo" src="photo.jpg" alt="The input photo"></div>
<div class="panel" id="panel">
  <h1>Vascular phantom, localized from one photo <button class="collapse" id="collapse">hide</button></h1>
  <p>The pose of the scanned vessel network is found from a single RGB photo (<span id="frame"></span>) with the
     Real2Sem2Real tracker. The scan's own camera for that photo is the ground truth.</p>
  <div class="key"><span style="--c: var(--found)">camera found from the photo</span>
                   <span style="--c: var(--scan)">scan camera (truth)</span></div>
  <div class="metrics" id="metrics"></div>
  <label><input type="checkbox" id="line" checked> <span style="color: var(--found); font-weight: 600">Red centerline</span> (from the mesh)</label>
  <label><input type="checkbox" id="tube" checked> Segmented tube splat</label>
  <label><input type="checkbox" id="mesh"> Tube mesh</label>
  <label><input type="checkbox" id="scene"> Whole scene splat</label>
  <label><input type="checkbox" id="cams" checked> Cameras</label>
  <div class="row" id="opRow" style="display:none">
    <label for="op" style="cursor:default">Overlay on the photo</label>
    <input type="range" id="op" min="0" max="1" step="0.01" value="0.75">
  </div>
  <button id="look">Look through the found camera</button>
  <button id="orbit" class="secondary" style="display:none">Back to free orbit</button>
</div>
<div id="status">Loading…</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { SparkRenderer, SplatMesh } from '@sparkjsdev/spark';

const D = await (await fetch('data.json')).json();
const $ = id => document.getElementById(id);
$('frame').textContent = D.frame;
const M = D.metrics;
$('metrics').innerHTML = [
  ['Rotation error', `${M.rotation_error_deg.toFixed(1)}°`],
  ['Position error', `${M.translation_error_pct_of_camera_distance.toFixed(1)}% of camera distance`],
  ['Image error (median / 95%)', `${M.px_error_median.toFixed(1)} / ${M.px_error_p95.toFixed(1)} px`],
].map(([k, v]) => `<span>${k}</span><b>${v}</b>`).join('');

const stage = $('stage'), photo = $('photo');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
stage.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const up = new THREE.Vector3(...D.up).normalize();
const center = new THREE.Vector3(...D.center);
const camera = new THREE.PerspectiveCamera(40, 1, 0.01, 50);
camera.up.copy(up);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
scene.add(new THREE.HemisphereLight(0xffffff, 0x6b7280, 1.4));
const sun = new THREE.DirectionalLight(0xffffff, 2.0); sun.position.copy(up.clone().multiplyScalar(3)).add(new THREE.Vector3(1, 1, 0));
scene.add(sun);

// cameras: OpenCV world-to-camera matrices -> centre and axes (x right, y down, z forward)
function cvCamera(w2c) {
  const m = new THREE.Matrix4().set(...w2c.flat()).invert();
  const e = m.elements;                                         // column-major
  return { C: new THREE.Vector3(e[12], e[13], e[14]), x: new THREE.Vector3(e[0], e[1], e[2]),
           y: new THREE.Vector3(e[4], e[5], e[6]), z: new THREE.Vector3(e[8], e[9], e[10]) };
}
const [fx, , cx] = D.K[0], [, fy, cy] = D.K[1], W = D.W, H = D.H;
function frustum(cam, color, depth, texture) {
  const g = new THREE.Group();
  const corner = (u, v) => cam.C.clone().addScaledVector(cam.x, (u - cx) / fx * depth)
                                        .addScaledVector(cam.y, (v - cy) / fy * depth).addScaledVector(cam.z, depth);
  const c = [corner(0, 0), corner(W, 0), corner(W, H), corner(0, H)];
  const pts = [cam.C, c[0], cam.C, c[1], cam.C, c[2], cam.C, c[3], c[0], c[1], c[1], c[2], c[2], c[3], c[3], c[0]];
  g.add(new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineBasicMaterial({ color })));
  if (texture) {
    const q = new THREE.BufferGeometry();
    q.setAttribute('position', new THREE.Float32BufferAttribute(c.flatMap(p => p.toArray()), 3));
    q.setAttribute('uv', new THREE.Float32BufferAttribute([0, 1, 1, 1, 1, 0, 0, 0], 2));
    q.setIndex([0, 1, 2, 0, 2, 3]);
    g.add(new THREE.Mesh(q, new THREE.MeshBasicMaterial({ map: texture, side: THREE.DoubleSide, transparent: true, opacity: 0.9 })));
  }
  return g;
}
const found = cvCamera(D.w2c_found), truth = cvCamera(D.w2c_scan);
const tex = new THREE.TextureLoader().load('photo.jpg'); tex.colorSpace = THREE.SRGBColorSpace;
const cams = new THREE.Group();
cams.add(frustum(found, 0xe8322f, 0.13, tex), frustum(truth, 0x22a447, 0.13, null));
scene.add(cams);

// splats and mesh
const spark = new SparkRenderer({ renderer }); scene.add(spark);
let pending = 3;
const done = () => { if (--pending === 0) $('status').style.display = 'none'; };
const tube = new SplatMesh({ url: 'tube.ply', onLoad: done });
const sceneSplat = new SplatMesh({ url: 'scene.ply', onLoad: done });
sceneSplat.visible = false;
scene.add(tube, sceneSplat);
// vessel centerline from the mesh: thin red tubes drawn over everything, so it shows through the splat
const centerline = new THREE.Group(); centerline.renderOrder = 10; scene.add(centerline);
fetch('centerline.json').then(r => r.ok ? r.json() : []).then(lines => {
  const mat = new THREE.MeshBasicMaterial({ color: 0xff1a1a, depthTest: false, depthWrite: false, transparent: true });
  for (const l of lines) {
    if (l.length < 2) continue;
    const curve = new THREE.CatmullRomCurve3(l.map(p => new THREE.Vector3(...p)), false, 'centripetal');
    const m = new THREE.Mesh(new THREE.TubeGeometry(curve, Math.max(4, l.length * 2), 0.0022, 8, false), mat);
    m.renderOrder = 10; centerline.add(m);
  }
  if (!lines.length) $('line').closest('label').style.display = 'none';
});
let mesh = null;
new GLTFLoader().load('mesh.glb', g => {
  mesh = g.scene;
  mesh.traverse(o => { if (o.isMesh) o.material = new THREE.MeshStandardMaterial({ color: 0xe8ae1c, roughness: 0.35, metalness: 0.0, transparent: true }); });
  mesh.visible = $('mesh').checked; scene.add(mesh); done();
});

// free orbit: start behind and above the found camera, looking at the tube
const orbitHome = () => {
  const pull = 1.35 * Math.max(1, 1.3 * window.innerHeight / window.innerWidth);   // narrow screens: step back
  camera.position.copy(found.C).sub(center).multiplyScalar(pull).add(center).addScaledVector(up, 0.15);
  controls.target.copy(center); controls.enabled = true; camera.up.copy(up); camera.updateProjectionMatrix();
};
orbitHome();

// look through the found camera: exact intrinsics, letterboxed to the photo's aspect, photo behind the render
let photoMode = false;
const R = new THREE.Matrix4().makeBasis(found.x.clone(), found.y.clone().negate(), found.z.clone().negate());
function setOpacity(a) {
  tube.opacity = sceneSplat.opacity = a;
  if (mesh) mesh.traverse(o => { if (o.isMesh) o.material.opacity = a; });
}
function enterPhoto() {
  photoMode = true; controls.enabled = false;
  camera.position.copy(found.C); camera.quaternion.setFromRotationMatrix(R);
  photo.style.display = 'block'; cams.visible = false;
  $('opRow').style.display = ''; $('look').style.display = 'none'; $('orbit').style.display = '';
  setOpacity(+$('op').value); resize();
}
function exitPhoto() {
  photoMode = false; photo.style.display = 'none'; cams.visible = $('cams').checked;
  $('opRow').style.display = 'none'; $('look').style.display = ''; $('orbit').style.display = 'none';
  setOpacity(1); orbitHome(); resize();
}
function resize() {
  const vw = window.innerWidth, vh = window.innerHeight;
  let w = vw, h = vh, l = 0, t = 0;
  if (photoMode) {
    if (vw / vh > W / H) { h = vh; w = vh * W / H; l = (vw - w) / 2; } else { w = vw; h = vw * H / W; t = (vh - h) / 2; }
    Object.assign(photo.style, { left: `${l}px`, top: `${t}px`, width: `${w}px`, height: `${h}px` });
  }
  Object.assign(renderer.domElement.style, { left: `${l}px`, top: `${t}px`, width: `${w}px`, height: `${h}px` });
  renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.updateProjectionMatrix();
  if (photoMode) {                                              // projection from K (OpenGL axes, y up)
    const n = camera.near, f = camera.far;
    camera.projectionMatrix.set(2 * fx / W, 0, 1 - 2 * cx / W, 0,
                                0, 2 * fy / H, 2 * cy / H - 1, 0,
                                0, 0, -(f + n) / (f - n), -2 * f * n / (f - n),
                                0, 0, -1, 0);
    camera.projectionMatrixInverse.copy(camera.projectionMatrix).invert();
  }
}
window.addEventListener('resize', resize);
resize();

$('tube').onchange = e => { tube.visible = e.target.checked; };
$('line').onchange = e => { centerline.visible = e.target.checked; };
$('scene').onchange = e => { sceneSplat.visible = e.target.checked; };
$('mesh').onchange = e => { if (mesh) mesh.visible = e.target.checked; };
$('cams').onchange = e => { cams.visible = e.target.checked && !photoMode; };
$('op').oninput = e => setOpacity(+e.target.value);
$('look').onclick = enterPhoto;
$('orbit').onclick = exitPhoto;
$('collapse').onclick = () => { $('panel').classList.toggle('closed'); $('collapse').textContent = $('panel').classList.contains('closed') ? 'show' : 'hide'; };

renderer.setAnimationLoop(() => {
  if (!photoMode) controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
